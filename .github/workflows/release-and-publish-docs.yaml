name: Stable release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Minify the css
        run: ./bin/lit -f styles.env

      - name: Transpile typescript and minify the js
        run: ./bin/esbuild ./src/start.ts --bundle --minify --tsconfig=tsconfig.json --target=chrome90,firefox90,safari15,edge90 --outfile=./scripts/start.js

      - name: Remove innecesary files and directories
        run: rm -rf docs design resources/readme .gitignore styles/src src bin/lit bin/esbuild bin/install-ts.sh styles.env tsconfig.json .github README.md server-n-cache.py package-lock.json .git

      - name: Create directories
        run: mkdir -p styles/src

      - name: Move css
        run: mv styles/out/master.css styles/src/master.css

      - name: Check the output
        run: ls -lha .

      - name: Create artefacts
        id: create-artefact
        run: mkdir artefacts

      - name: Compress code
        id: compress
        run: tar --exclude artefacts/papiro-latest.tar.gz -czvf artefacts/papiro-latest.tar.gz .

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest artefacts/papiro-latest.tar.gz --title "v1.0.0 - beta" --notes "Latest papiro build." --latest
  publish-docs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: akrck02/papiro-deploy@main
        with:
          title: "Papiro"
          description: "The simple markdown wiki."
          path: "resources/wiki"
          isObsidianProject: false
          showFooter: true
          showBreadcrumb: true
          showStartPage: true
      - name: Deploy to github actions 🚀
        uses: JamesIves/github-pages-deploy-action@v4 # please checkout and give a star to this amazing action.
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: . # The folder the action should deploy.
